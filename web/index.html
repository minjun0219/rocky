<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rocky</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪨</text></svg>"
    />
    <script>
      // 첫 페인트 전에 data-theme 을 확정해 FOUC 를 막는다. 번들 전에 실행돼야 해서
      // src/ui/lib.ts 의 readThemePref/resolveTheme 을 import 할 수 없다 — 같은 규칙을
      // 복제한 것이니 한쪽을 고치면 반드시 다른 쪽도 고쳐야 한다.
      // localStorage 는 프라이빗 모드/차단 설정에서 던질 수 있다. try 는 **읽기만** 감싼다:
      // 읽기 실패를 "저장값 없음"(= auto)으로 다뤄야 store 와 결론이 같아진다. catch 에서
      // "dark" 로 단정하면 store 는 auto 로 출발하는데 화면만 다크로 굳는다.
      var stored = null;
      try {
        stored = localStorage.getItem("rocky:theme");
      } catch (_) {
        // 저장값을 못 읽은 것뿐이다. 아래 해석이 auto 로 떨어져 OS 를 따른다.
      }
      var pref = stored === "dark" || stored === "light" || stored === "auto" ? stored : "auto";
      // matchMedia 까지 던지면 data-theme 이 안 붙지만, 다크 블록 선택자가
      // `:root, :root[data-theme="dark"]` 라 무스타일이 아니라 다크로 뜬다.
      document.documentElement.dataset.theme =
        pref === "auto"
          ? window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark"
          : pref;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
