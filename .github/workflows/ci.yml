name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # changeset 의 패키지 이름이 workspace 와 어긋나면 여기서 죽는다.
      # 이 검증이 없으면 main 에 머지된 뒤 Release 워크플로의 version 스텝에서야 터진다.
      - name: Changeset package name
        run: bun run check:changesets

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: rust fmt + clippy + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build rockyd
        run: cargo build -p rockyd

      - name: Build UI
        run: bun run build:ui

      # Chromium 쪽은 내려받지 않는다 — 러너에 깔린 Google Chrome 을 쓴다(playwright.config.ts 가 CI 면 channel: 'chrome').
      # cmux 의 웹뷰(WKWebView = Safari 엔진)를 흉내 내는 cmux-webkit 프로젝트만 WebKit 과 그 시스템 의존을 받는다.
      - name: Install WebKit
        run: bunx playwright install --with-deps webkit

      - name: E2E
        run: bun run e2e
        env:
          E2E_NO_BUILD: '1'

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
