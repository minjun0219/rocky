name: Release

# rust-rewrite 는 프리릴리즈 채널이다 — changesets pre 모드(`.changeset/pre.json`)라
# Version PR 이 `0.15.0-next.N` 을 찍고, release job 이 `--prerelease` 로 낸다.
# 통합이 끝나 main 으로 들어가면 `changeset pre exit` 로 정식 번호가 된다.
on:
  push:
    branches: [main]
  # 릴리스는 생겼는데 assets job 이 실패한 경우의 복구 경로 — 같은 push 를 재실행하면
  # release job 이 "이미 있음" 으로 created=false 를 내서 assets 가 영영 안 돈다.
  # 태그를 지정해 그 커밋에서 산출물만 다시 만들어 붙인다.
  workflow_dispatch:
    inputs:
      tag:
        description: "산출물을 다시 붙일 릴리스 태그 (예: v0.15.0-next.0)"
        required: true
        type: string

# changesets/action 이 Version PR 브랜치를 push 하고 PR 을 열 수 있어야 함
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version packages PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # publish 입력을 지정하지 않음 → Version PR 생성/갱신만, npm publish 없음.
      # version 커맨드를 오버라이드해 changeset version 뒤 plugin.json 을 sync.
      - name: Create Version Packages PR
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          title: "chore(release): Version Packages"
          commit: "chore(release): Version Packages (CHANGELOG + plugin.json sync)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Version PR 이 병합돼 main 버전이 오르면 v<version> 태그 + GitHub Release 생성 (멱등, npm 무관).
  # changeset 이 남아 있는 push(=Version PR 생성 단계)에서는 main 의 버전이 아직 안 올랐으므로
  # 그 버전의 release 가 이미 있어 skip 된다.
  #
  # **별도 job 인 이유**: 같은 job 에 두면 앞 스텝의 changesets/action 이 워킹 트리를 Version PR
  # 브랜치로 옮긴 뒤라, 아직 머지되지도 않은 커밋에 태그가 박힌다. 실제로 v0.5.0~v0.8.0 이 그렇게
  # main 밖 커밋을 가리켰고 릴리스가 PR 머지보다 2시간 먼저 생성됐다. 별도 job 은 push 된 커밋을
  # 그대로 체크아웃하므로 package.json 도 main 기준으로 읽힌다.
  release:
    name: tag + GitHub Release
    needs: version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # release-github.ts 는 로컬 모듈만 import 하므로 bun install 이 필요 없다.
      - name: Tag + GitHub Release on version bump
        id: release
        run: bun scripts/release-github.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}

  # 릴리스가 새로 생긴 push(또는 태그를 지정한 수동 실행)에서만 돈다 — macOS 러너에서
  # CLI/데몬 바이너리를 만들어 그 릴리스에 첨부한다. 플러그인 부트스트랩(bin/rocky-todo)이
  # 이 tarball 을 받는다.
  #
  # 러너는 Apple Silicon 이미지를 명시한다 — 산출물 이름·문서가 aarch64-apple-darwin 하나를
  # 약속하므로 `macos-latest` 의 별칭이 옮겨가도 타깃이 바뀌면 안 된다. Package 스텝이
  # 실제 host triple 을 한 번 더 확인한다.
  assets:
    name: macOS binaries
    needs: release
    # 수동 실행이면 release job 은 skip 이라 needs 만으로는 안 돈다 — !cancelled() 로 평가시킨다
    if: >-
      !cancelled() &&
      (needs.release.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 수동 실행은 그 태그의 커밋에서 빌드한다 — 브랜치 HEAD 가 아니라
          ref: ${{ inputs.tag || github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI + daemon
        run: cargo build --release --locked -p rocky-todo-cli -p rocky-todod

      - name: Package
        id: package
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || { echo "TAG 가 비어 있다"; exit 1; }
          TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$TARGET" != "aarch64-apple-darwin" ]; then
            echo "러너 타깃이 aarch64-apple-darwin 이 아니다: $TARGET — 문서와 산출물 이름이 어긋난다"
            exit 1
          fi
          mkdir -p out
          # tarball = CLI + 데몬. 플러그인 부트스트랩(bin/rocky-todo)이 이 레이아웃 그대로 설치한다.
          # AppleDouble(`._*`) 항목이 tar 에 섞이지 않게 COPYFILE_DISABLE.
          COPYFILE_DISABLE=1 tar -czf "out/rocky-todo-${TAG}-${TARGET}.tar.gz" \
            -C target/release rocky-todo rocky-todod
          (cd out && shasum -a 256 -- *.tar.gz > SHA256SUMS && shasum -c SHA256SUMS)
          ls -la out

      - name: Upload to release
        run: gh release upload "$TAG" out/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
